<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socratic Workshop</title>
<style>
:root{color-scheme:light;--page:#f5f6fa;--surface:#fff;--soft:#f0f1f7;--ink:#20212b;--muted:#656778;--border:#e6e7ef;--accent:#6d3fd4;--accent-soft:#f0eafb;--accent-ink:#fff;--shadow:0 12px 40px #20212b06;--type-title:clamp(28px,3vw,32px);--type-panel:18px;--type-body:16px;--type-note:14px;--type-value:20px;--scene-height:clamp(220px,calc(100svh - 420px),340px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#111218;--surface:#1a1c25;--soft:#222530;--ink:#f1f1f7;--muted:#a3a6b9;--border:#303341;--accent:#b69aff;--accent-soft:#2e2545;--accent-ink:#1b132b;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--page:#111218;--surface:#1a1c25;--soft:#222530;--ink:#f1f1f7;--muted:#a3a6b9;--border:#303341;--accent:#b69aff;--accent-soft:#2e2545;--accent-ink:#1b132b;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:var(--type-body)/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1180px;padding:24px 28px 20px;margin:auto}
h1{font-size:var(--type-title);letter-spacing:-.035em;font-weight:650;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:var(--type-panel);letter-spacing:-.02em;line-height:1.35;margin:0 0 16px}
p{margin:0 0 12px}
.demo-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 24px;margin-bottom:20px}
.demo-header .intro{grid-column:1/-1;margin:0;max-width:65ch;font-size:var(--type-body);line-height:1.5;color:var(--muted)}
.demo-header .theme-toggle{grid-column:2;grid-row:1;min-height:44px;font-size:var(--type-note);padding:8px 12px}
.theme-toggle{display:inline-flex;align-items:center;gap:8px;background:transparent;box-shadow:none}
.theme-toggle svg{width:18px;height:18px;flex:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
.layout,.frame-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start}
.stage{min-width:0}
.graphic{display:block;width:100%;height:auto;overflow:visible}
.viewport-scene{height:var(--scene-height)}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.button,button,select{font:inherit;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-weight:550}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.control{margin-bottom:18px}
.control label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:var(--type-body);font-weight:550;margin-bottom:6px}
output{font-variant-numeric:tabular-nums;color:var(--accent)}
input[type="range"]{display:block;width:100%;min-height:44px;margin:0;accent-color:var(--accent);cursor:pointer}
.metrics{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.metrics dl{margin:0;min-width:64px}
.metrics dt{color:var(--muted);font-size:var(--type-note)}
.metrics dd{font-size:var(--type-value);line-height:1.25;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 0}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:var(--type-note);margin-top:10px}
.feedback{margin-top:16px;background:var(--accent-soft);border:1px solid transparent;border-radius:18px;padding:16px 18px}
.feedback h2{font-size:var(--type-panel);line-height:1.35;margin-bottom:8px}
.feedback p:last-child{margin-bottom:0}
.feedback .detail{font-size:var(--type-note);color:var(--muted)}
.equation{font-family:ui-monospace,SFMono-Regular,monospace;font-size:var(--type-note);overflow-wrap:anywhere}
.model-notes{margin-top:8px;color:var(--muted);font-size:var(--type-note);max-width:80ch}
.model-notes summary{display:inline-block;cursor:pointer;min-height:44px;padding:10px 0}
.model-notes summary::before{content:"+ ";color:var(--accent)}
.model-notes[open] summary::before{content:"− "}
.model-notes p{margin-top:8px}
.reference-panel{display:grid;grid-template-rows:auto minmax(0,1fr);gap:18px;min-width:0}
.panel-content{display:grid;place-content:center;min-width:0;padding-block:16px}
.context-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px}
.learning-layout{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.45fr);gap:28px;align-items:stretch}
.learning-layout h2{text-align:center}
.target-panel{min-width:0;padding-left:28px;border-left:1px solid var(--border)}
.task-prompt{margin-top:18px}
@media(max-width:980px){.learning-layout{grid-template-columns:1fr;gap:24px}.learning-layout .reference-panel{gap:16px;padding-bottom:24px;border-bottom:1px solid var(--border)}.target-panel{padding-left:0;border-left:0}}
a{color:var(--muted);text-underline-offset:4px}
[hidden]{display:none!important}
@media(hover:hover) and (pointer:fine){button:hover:not(:disabled){border-color:var(--accent)}a:hover{color:var(--ink)}}
@media(max-width:900px){main{padding:20px 18px 28px}.layout,.frame-layout{grid-template-columns:1fr}.card{padding:20px;border-radius:22px}.metrics{gap:22px}.graphic.viewport-scene{height:300px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}button:active:not(:disabled){transform:none}}
@media print{:root,:root[data-theme="dark"]{color-scheme:light;--page:#fff;--surface:#fff;--ink:#111;--muted:#444;--border:#ddd;--accent:#5630a8;--accent-soft:#f5f1fb;--accent-ink:#fff}main{max-width:none;padding:0}.actions,.theme-toggle,input,select,.prediction{display:none}.layout,.frame-layout{display:block}.card{break-inside:avoid;box-shadow:none;margin-bottom:20px}.graphic{max-height:360px}.model-notes{display:block}}

/* Comparison pattern: label, mark and value share one row and one column definition. */
.comparison{--comparison-columns:88px minmax(0,1fr) 72px;--comparison-gap:20px;--comparison-grid:25%;--guide:0%;margin-top:24px}
.comparison-axis,.comparison-row{display:grid;grid-template-columns:var(--comparison-columns);column-gap:var(--comparison-gap);align-items:center}
.comparison-axis{min-height:38px;padding-bottom:12px;color:var(--muted);font-size:14px}
.comparison-scale{position:relative;height:22px;font-variant-numeric:tabular-nums}
.comparison-tick{position:absolute;left:var(--tick);transform:translateX(-50%)}
.comparison-tick:first-child{transform:none}.comparison-tick:last-child{transform:translateX(-100%)}
.comparison-unit,.comparison-value{text-align:right;font-variant-numeric:tabular-nums}
.comparison-label{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:600;padding:12px 0}
.comparison-track{position:relative;align-self:stretch;min-height:56px;display:flex;align-items:center;background:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:var(--comparison-grid) 100%;border-right:1px solid var(--border)}
.comparison-bar{height:15px;width:var(--value-percent,0%);background:var(--border);border-radius:0 7px 7px 0}
.comparison-bar.is-limiting{background:var(--accent)}
.comparison-guide{position:absolute;inset-block:0;left:var(--guide);border-left:2px dashed var(--accent);pointer-events:none}
.comparison-badge{font-size:14px;font-weight:500;padding:2px 6px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
/* Annotation pattern: metadata sits in normal flow above the item surface. */
.annotated-set{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:8px;list-style:none;margin:0;padding:0;min-width:0}
.annotated-item{display:grid;grid-template-rows:minmax(20px,auto) auto;gap:8px;flex:0 0 auto;min-width:0;max-width:100%}
.item-role{display:block;min-height:20px;text-align:center;font-size:14px;line-height:1.4;font-weight:550;color:var(--muted);letter-spacing:0}
.item-body{display:flex;align-items:center;justify-content:center;min-height:56px;padding:10px 12px;border:2px solid transparent;border-radius:14px;background:var(--soft);font-size:22px;font-weight:550;line-height:1.25;letter-spacing:-.025em;white-space:nowrap}
.annotated-item.is-accented .item-body{background:var(--accent-soft);color:var(--accent)}
.annotated-item.is-outlined .item-body{background:transparent;border-color:var(--accent);color:var(--accent)}
.annotated-item.is-empty .item-body{min-width:42px;border:1px dashed var(--border);background:transparent;color:var(--muted)}
@media(max-width:600px){.comparison{--comparison-columns:52px minmax(0,1fr) 56px;--comparison-gap:12px}}
</style>

<!-- Desktop height budget: keep the working scene and controls in one visible frame. -->

</head>
<body>
<main>
<header class="demo-header"><h1>Explore a concept</h1><button id="theme-toggle" class="theme-toggle" aria-label="Switch color theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span id="theme-label">Dark</span></button><p class="intro">Change one input to explore its effect.</p></header>
<!-- Copy this shell into a standalone HTML. Replace the header and this card with the concept's model, controls, and concise feedback. Keep only the classes used by that artifact. -->
<section class="card"><p>The visualization, its controls, and its current result belong together.</p></section>
</main>
<!-- Copy the needed inert pattern into the output, then fill its slots from the model. -->
<template id="comparison-row-pattern"><div class="comparison-row"><span class="comparison-label" data-slot="label"></span><div class="comparison-track"><div class="comparison-bar" data-slot="bar"></div><i class="comparison-guide" aria-hidden="true"></i></div><span class="comparison-value" data-slot="value"></span></div></template>
<template id="annotated-item-pattern"><li class="annotated-item"><span class="item-role" aria-hidden="true"></span><span class="item-body"></span></li></template>
<template id="reference-task-pattern"><section class="card learning-layout"><div class="reference-panel"><h2 data-slot="reference-title"></h2><div class="panel-content" data-slot="reference"></div></div><div class="target-panel"><h2 data-slot="task-title"></h2><div class="context-row" data-slot="context"></div><div class="task-prompt" data-slot="question"></div><div class="actions" data-slot="actions"></div></div></section></template>
<script>
const themeButton = document.getElementById('theme-toggle');
const systemTheme = matchMedia('(prefers-color-scheme: dark)');
function currentTheme(){return document.documentElement.dataset.theme || (systemTheme.matches ? 'dark' : 'light');}
function updateThemeButton(){const dark = currentTheme() === 'dark';document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';themeButton.setAttribute('aria-label',dark ? 'Switch to light theme' : 'Switch to dark theme');}
try{const savedTheme = localStorage.getItem('socratic-workshop-theme');if(savedTheme === 'dark' || savedTheme === 'light')document.documentElement.dataset.theme = savedTheme;}catch{}
themeButton.addEventListener('click',()=>{const theme = currentTheme() === 'dark' ? 'light' : 'dark';document.documentElement.dataset.theme = theme;try{localStorage.setItem('socratic-workshop-theme',theme);}catch{}updateThemeButton();});
systemTheme.addEventListener('change',updateThemeButton);
updateThemeButton();
</script>
</body>
</html>
