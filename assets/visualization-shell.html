/* Glass tokens: text and lines are the text colour at fixed alpha tiers. */
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{
  color-scheme:light;
  --work:#ececec;
  --glass:rgba(250,250,250,.60);
  --edge:rgba(0,0,0,.12);
  --text-rgb:22,22,22;

  --sep-soft:rgba(0,0,0,.08);

  --t-body:.68;
  --t-label:.60;
  --t-hint:.56;
  --t-off:.31;
  --grid-line:rgba(var(--text-rgb),.07);
  --axis-line:rgba(var(--text-rgb),.20);
  --mark-neutral:rgba(var(--text-rgb),.74);
  --amber-lch:0.70 0.16 60;
  --coral-lch:0.62 0.18 35;

  --coral:oklch(var(--coral-lch));
  --select-bg:linear-gradient(90deg in oklab,oklch(var(--amber-lch) / .15),oklch(var(--coral-lch) / .06));

  --ground-bottom:oklch(0.905 0.035 68);
  --dots-top:oklch(0.885 0 0);
  --dots-bottom:oklch(0.855 0.038 68);

*{box-sizing:border-box}
[hidden]{display:none!important}

/* The body is the work: a neutral-to-ember floor under a fixed dot grid. */
body{
  margin:0;
  min-height:100svh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 392px;
  grid-template-rows:auto minmax(0,1fr);
  background:var(--work);
  color:rgba(var(--text-rgb),var(--t-body));
  font:17px/22px var(--font);
  isolation:isolate;
}
/* Fixed layers: ground gradient + dither, then dots in the same direction. A dot
   sits one OKLab L step (±0.05) off the ground behind it — lighter on dark
   ground, darker once ground L passes 0.55 — one contrast over the whole field. */
body::before,body::after,.ground-dots{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:var(--work)}
.ground-dots{
  background:var(--dot);
  -webkit-mask-image:radial-gradient(circle at 12px 12px,#000 1px,transparent 1.6px);
  mask-image:radial-gradient(circle at 12px 12px,#000 1px,transparent 1.6px);
  -webkit-mask-size:24px 24px;mask-size:24px 24px;
}

/* Header floats on the work; only the theme pill is glass. */
.stage-header{
  grid-column:1;grid-row:1;position:relative;
  padding:24px 32px 0 32px;
}
.stage-header h1{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.02em;color:rgba(var(--text-rgb),var(--t-strong));margin:0;text-wrap:balance}
.stage-header .intro{margin:4px 0 0;max-width:65ch;font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-body))}
.theme-toggle{
  position:absolute;top:20px;right:32px;
  display:inline-flex;align-items:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:10px;
  background:var(--field);border:1px solid var(--field-edge);
  color:rgba(var(--text-rgb),var(--t-value));font-size:15px;
}
.theme-toggle svg{width:18px;height:18px;flex:none}

/* Right pillar: docked full-height chrome; panels become sections. */
.pillar{
  grid-column:2;grid-row:1/3;
  width:392px;margin:0;
  display:flex;flex-direction:column;
  min-height:0;overflow-y:auto;
  background:var(--glass);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-left:1px solid var(--edge);
}
.pillar>.panel{
  background:none;border:none;border-radius:0;
  padding:24px;min-width:0;
}
.pillar>.panel+.panel{border-top:1px solid var(--sep-strong)}
.panel>h2,.panel-title{font-size:20px;line-height:25px;font-weight:600;color:rgba(var(--text-rgb),var(--t-strong));margin:0 0 16px}

/* The figure lives in the free space; playback floats directly below it. */
.figure-area{
  grid-column:1;grid-row:2;
  display:grid;grid-template-rows:minmax(0,1fr) auto auto;
  gap:12px;min-width:0;min-height:0;
  padding:32px 0 80px 32px;
}
.plot{position:relative;min-height:0}
.graphic{display:block;width:100%;height:100%}
.graphic text{font:15px var(--font);fill:rgba(var(--text-rgb),var(--t-hint))}
.playback{
  position:fixed;left:0;right:392px;bottom:0;z-index:10;
  height:64px;padding:10px 32px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  overflow-x:auto;scrollbar-width:none;
  background:var(--glass);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:none;border-top:1px solid var(--edge);border-radius:0;
}
.playback::-webkit-scrollbar{display:none}
.playback>button{flex:1 1 0;min-width:max-content;max-width:200px;height:44px;padding:0 16px;font-size:15px}
.readouts{flex:none;margin-left:auto;align-self:stretch;display:flex;align-items:center;gap:32px;padding:0 0 0 24px;border-left:1px solid var(--sep-strong)}
.readouts dl{margin:0;width:7ch;text-align:center}
.readouts dt{font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-label));margin-bottom:4px;text-align:center}
.readouts dd{margin:0;font-size:17px;font-weight:400;line-height:22px;font-variant-numeric:tabular-nums;color:rgba(var(--text-rgb),var(--t-value));text-align:center}
.figure-meta{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-hint))}
.legend i{flex:none;display:block}
.legend .key-line{width:22px;height:0;border-top:2.5px solid var(--mark-neutral)}
.legend .key-current{width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid var(--work);box-sizing:border-box}
.legend .key-next{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--coral);box-sizing:border-box}
.legend button{min-height:44px;padding:8px;border-radius:10px;background:none;border:none;border-radius:8px;color:inherit;font:inherit;font-size:15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.playback-status{font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-hint));margin:0;min-height:20px}

/* Small glass pill for notices that sit over the figure. */
.notice{
  position:absolute;top:12px;left:56px;right:16px;
  background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  border:1px solid var(--edge);border-radius:10px;padding:8px 12px;
  font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-value));
}

/* Buttons: field look; primary/active is the selection look. */
button,.button,select{
  position:relative;overflow:hidden;
  font:inherit;font-size:15px;
  min-height:44px;padding:0 16px;
  border:1px solid var(--field-edge);border-radius:10px;
  background-color:var(--field);background-image:linear-gradient(transparent,transparent);
  color:rgba(var(--text-rgb),var(--t-value));
  cursor:pointer;
}
button::after,.button::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(var(--text-rgb),0);transition:background .12s;pointer-events:none}
button.primary,.button.primary{background-color:transparent;background-image:var(--select-bg);border-color:var(--select-edge);color:rgba(var(--text-rgb),var(--t-strong))}
button:disabled{color:rgba(var(--text-rgb),var(--t-off));cursor:default}
@media(hover:hover) and (pointer:fine){
  button:hover:not(:disabled)::after{background:rgba(var(--text-rgb),.05)}
  .legend button:hover{background:rgba(var(--text-rgb),.05)}
}
button:active:not(:disabled)::after{background:rgba(var(--text-rgb),.08)}
button:focus-visible,.button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* Control block: label row, 8, 44 px control, 24 to the next label. */
.control{margin-bottom:24px}
.control>label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:17px;color:rgba(var(--text-rgb),var(--t-label));margin-bottom:8px}
.control output{font-size:17px;font-variant-numeric:tabular-nums;color:rgba(var(--text-rgb),var(--t-value))}

/* Glass slider field: the fill carries the value, the amber thumb marks its edge.
   --p is a registered property so the fill and the drawn thumb glide together. */
input[type="range"]{
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;height:44px;margin:0;overflow:hidden;
  --p:0%;
  background:
    var(--noise) 0 0/128px 128px,
    linear-gradient(90deg,transparent calc(var(--p) - 1.5px),var(--amber) 0 calc(var(--p) + 1.5px),transparent 0) 0 4px/100% calc(100% - 8px) no-repeat,
    var(--slider-fill) 0 0/var(--p) 100% no-repeat,
    var(--field);
  border:1px solid var(--field-edge);border-radius:10px;
  cursor:pointer;
  transition:--p 120ms cubic-bezier(0.2,0.8,0.2,1);
}
input[type="range"]::-webkit-slider-runnable-track{height:44px;background:transparent;border:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:36px;margin-top:4px;border:none;background:transparent}
input[type="range"]::-moz-range-track{height:100%;background:var(--field);border:none;border-radius:10px}
input[type="range"]::-moz-range-progress{height:100%;background:var(--slider-fill);border-radius:10px 0 0 10px}
input[type="range"]::-moz-range-thumb{width:3px;height:36px;border:none;border-radius:2px;background:var(--amber)}

/* Feedback: an inset group with an amber leading bar, never a coloured fill. */
.feedback{background:var(--inset);border-left:2px solid var(--amber);border-radius:8px;padding:16px}
.feedback h2,.feedback h3{font-size:17px;line-height:22px;font-weight:600;color:rgba(var(--text-rgb),var(--t-strong));margin:0 0 6px}
.feedback p{margin:0 0 8px;font-size:17px;line-height:22px;color:rgba(var(--text-rgb),var(--t-body))}
.feedback p:last-child{margin-bottom:0}
.feedback .detail{font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-hint))}
.equation{font-family:var(--mono);font-size:15px;overflow-wrap:anywhere}

/* Disclosures: a soft separator, a 52 px row with a centred chevron; the body
   opens by animating its row height. */
.disclosure{border-top:1px solid var(--sep-soft)}
.panel *:not(.disclosure):has(+ .disclosure){margin-bottom:16px}
/* Row = separator + 52 px; the hover fill is inset 4 px from the separators
   (44 px tall) and bleeds 8 px into the panel padding on both sides. */
.disclosure summary{
  position:relative;
  list-style:none;display:flex;align-items:center;height:52px;margin:0 -8px;padding:0 8px;
  font-size:17px;color:rgba(var(--text-rgb),var(--t-body));cursor:pointer;
}
.disclosure summary::before{
  content:"";position:absolute;top:4px;bottom:4px;left:0;right:0;z-index:-1;
  border-radius:10px;background:rgba(var(--text-rgb),0);transition:background .12s;
}
.disclosure summary::-webkit-details-marker{display:none}
/* Chevron is a centred 16 px box on the row's own centre line. */
.disclosure summary::after{
  content:"";margin-left:auto;width:16px;height:16px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.disclosure summary::after{
  background:none;
}
.disclosure summary::after{
  content:"";
  border-right:1.5px solid rgba(var(--text-rgb),var(--t-hint));
  border-bottom:1.5px solid rgba(var(--text-rgb),var(--t-hint));
  width:8px;height:8px;
  transform:rotate(45deg) translateY(-2px);
  transition:transform .2s;
}
.disclosure[open] summary::after{transform:rotate(225deg) translateY(-2px)}
@media(hover:hover) and (pointer:fine){
  .disclosure summary:hover::before{background:rgba(var(--text-rgb),.05)}
  .disclosure summary:hover::after{border-color:rgba(var(--text-rgb),var(--t-value))}
}
.disclosure summary:active::before{background:rgba(var(--text-rgb),.08)}
.disclosure .summary-label{display:flex;align-items:center}
@supports (text-box: trim-both cap alphabetic){
  .disclosure .summary-label{text-box:trim-both cap alphabetic}
}
@supports not (text-box: trim-both cap alphabetic){
  .disclosure .summary-label{padding-top:1px}
}
.disclosure .disclosure-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease-in-out}
.disclosure[open] .disclosure-body{grid-template-rows:1fr}
.disclosure.closing .disclosure-body{grid-template-rows:0fr}
.disclosure-inner{overflow:hidden;min-height:0}
.disclosure-inner>:first-child{margin-top:8px}
.disclosure-inner>:last-child{margin-bottom:16px}
.disclosure p{font-size:17px;line-height:22px;color:rgba(var(--text-rgb),var(--t-body))}

a{color:rgba(var(--text-rgb),var(--t-hint));text-underline-offset:4px}
@media(hover:hover) and (pointer:fine){a:hover{color:rgba(var(--text-rgb),var(--t-value))}}

/* Mark popovers: every meaningful mark is a button that opens one glass popover. */
[data-mark]{cursor:pointer;transition:filter .12s}
[data-mark]:hover{filter:brightness(1.25)}
[data-mark].is-open:hover{filter:drop-shadow(0 0 1px var(--amber))}
[data-mark]:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
[data-mark].is-open{filter:drop-shadow(0 0 1px var(--amber))}
.mark-hit{fill:transparent;stroke:transparent;stroke-width:44px}
.mark-popover{
  position:fixed;z-index:20;box-sizing:border-box;margin:0;
  max-width:260px;padding:12px;
  background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  border:1px solid var(--edge);border-radius:10px;
  opacity:0;transition:opacity .12s ease-in,transform .12s ease-in;
}
.mark-popover[data-side="right"]{transform:translateX(-4px) scale(.96);transform-origin:left center}
.mark-popover[data-side="left"]{transform:translateX(4px) scale(.96);transform-origin:right center}
.mark-popover.is-open{opacity:1;transform:translateX(0) scale(1);transition:opacity .16s cubic-bezier(.2,.8,.2,1),transform .16s cubic-bezier(.2,.8,.2,1)}
.mark-popover h3{margin:0 0 4px;font-size:17px;line-height:22px;font-weight:600;color:rgba(var(--text-rgb),var(--t-strong))}
.mark-popover p{margin:0;font-size:15px;line-height:20px;color:rgba(var(--text-rgb),var(--t-body))}
.mark-popover .mark-value{margin-top:6px;font-variant-numeric:tabular-nums;color:rgba(var(--text-rgb),var(--t-value))}

/* Comparison pattern: label, mark and value share one row and one scale. */
.comparison{--comparison-columns:88px minmax(0,1fr) 72px;--comparison-gap:20px;--comparison-grid:25%;--guide:0%;margin-top:16px}
.comparison-axis,.comparison-row{display:grid;grid-template-columns:var(--comparison-columns);column-gap:var(--comparison-gap);align-items:center}
.comparison-axis{min-height:38px;padding-bottom:12px;font-size:15px;color:rgba(var(--text-rgb),var(--t-hint))}
.comparison-scale{position:relative;height:22px;font-variant-numeric:tabular-nums}
.comparison-tick{position:absolute;left:var(--tick);transform:translateX(-50%)}
.comparison-tick:first-child{transform:none}.comparison-tick:last-child{transform:translateX(-100%)}
.comparison-unit,.comparison-value{text-align:right;font-variant-numeric:tabular-nums}
.comparison-label{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px 0;font-size:17px;color:rgba(var(--text-rgb),var(--t-body))}
.comparison-value{font-size:17px;color:rgba(var(--text-rgb),var(--t-value))}
.comparison-track{position:relative;align-self:stretch;min-height:44px;display:flex;align-items:center;background:linear-gradient(to right,var(--grid-line) 1px,transparent 1px);background-size:var(--comparison-grid) 100%;border-right:1px solid var(--sep-soft)}
.comparison-bar{height:15px;width:var(--value-percent,0%);background:rgba(var(--text-rgb),.20);border-radius:2px;transition:width .16s cubic-bezier(.2,.8,.2,1)}
.comparison-bar.is-limiting{background:var(--ember-fill)}
.comparison-guide{position:absolute;inset-block:0;left:var(--guide);border-left:2px dashed var(--coral);pointer-events:none}
.comparison-badge{font-size:15px;padding:2px 6px;border-radius:8px;background:var(--select-bg);border:1px solid var(--select-edge);color:rgba(var(--text-rgb),var(--t-strong))}

/* Annotated items: metadata sits in normal flow above the tile. */
.annotated-set{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:8px;list-style:none;margin:0;padding:0;min-width:0}
.annotated-item{display:grid;grid-template-rows:minmax(20px,auto) auto;gap:8px;flex:0 0 auto;min-width:0;max-width:100%}
.item-role{display:block;min-height:20px;text-align:center;font-size:15px;line-height:1.4;color:rgba(var(--text-rgb),var(--t-hint))}
.item-body{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:var(--field);font-size:20px;line-height:1.25;letter-spacing:-.01em;white-space:nowrap;color:rgba(var(--text-rgb),var(--t-value))}
.annotated-item.is-accented .item-body{background:var(--select-bg);border-color:var(--select-edge);color:rgba(var(--text-rgb),var(--t-strong));font-weight:600}
.annotated-item.is-outlined .item-body{background:transparent;border-color:var(--coral);color:rgba(var(--text-rgb),var(--t-strong))}
.annotated-item.is-empty .item-body{min-width:44px;border-style:dashed;border-color:var(--sep-strong);background:transparent;color:rgba(var(--text-rgb),var(--t-hint))}

/* Reference/task pattern: one glass panel, two panes over a soft separator. */
.learning-layout{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.45fr);gap:28px;align-items:stretch}
.learning-layout h2{text-align:center}
.reference-panel{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;min-width:0}
.panel-content{display:grid;place-content:center;min-width:0;padding-block:16px}
.context-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px}
.target-panel{min-width:0;padding-left:24px;border-left:1px solid var(--sep-soft)}
.task-prompt{margin-top:16px}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}

/* Narrow: the stage scrolls; panels become full-width cards below the figure. */
@media(max-width:900px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .stage-header{grid-row:1;padding:16px 16px 8px}
  .figure-area{grid-row:2;padding:8px 16px 4px}
  .graphic{height:300px}
  .pillar{grid-column:1;grid-row:3;width:auto;margin:0;border-left:none;border-top:1px solid var(--sep-strong);overflow:visible;padding-bottom:64px}
  .pillar>.panel{border-radius:0}
  .playback{right:0}
  .learning-layout{grid-template-columns:1fr;gap:24px}
  .learning-layout .reference-panel{gap:16px;padding-bottom:24px;border-bottom:1px solid var(--sep-soft)}
  .target-panel{padding-left:0;border-left:0}
}
@media(max-width:600px){.comparison{--comparison-columns:52px minmax(0,1fr) 56px;--comparison-gap:12px}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important}
  input[type="range"],button::after,.mark-popover{transition-duration:80ms}
  .mark-popover{transform:none!important}
  .comparison-bar,.disclosure .disclosure-body{transition:none!important}
}
@media(prefers-reduced-transparency:reduce){
  :root{--glass:rgb(248,248,248)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgb(30,30,30)}}
  :root[data-theme="dark"]{--glass:rgb(30,30,30)}
  *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
@media(prefers-contrast:more){
  :root{--t-label:.80;--t-hint:.80;--edge:rgba(0,0,0,.40)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge:rgba(255,255,255,.40)}}
  :root[data-theme="dark"]{--edge:rgba(255,255,255,.40)}
}
@media print{
  :root,:root[data-theme="dark"]{color-scheme:light;--work:#fff;--glass:#fff;--edge:#ddd;--text-rgb:22,22,22;--field:#f5f5f5;--field-edge:#ddd;--inset:#f7f7f7;--sep-strong:#bbb;--sep-soft:#ddd}
  *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  body{display:block;background:#fff}
  body::before,body::after,.ground-dots{display:none!important}
  .theme-toggle,.playback,input,select,.prediction{display:none}
  .stage-header,.figure-area{padding:0}
  .pillar{width:auto;margin:16px 0;overflow:visible}
  .panel{break-inside:avoid;margin-bottom:16px}
  .graphic{height:320px}
  .disclosure{display:block}
}
</style>

<!-- Desktop height budget: keep the working scene and controls in one visible frame at 1280x720. -->

</head>
<body>
<div class="ground-dots" aria-hidden="true"></div>
<header class="stage-header">
<div><h1>Explore a concept</h1><!-- Optional keyboard-legend slot: <p class="td-hint">Drag or ← → to turn · scroll or + − to descend · click a part</p> -->
<p class="intro">Change one input to explore its effect.</p></div>
<button id="theme-toggle" class="theme-toggle" aria-label="Switch color theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span id="theme-label">Dark</span></button>
</header>
<!-- Copy this shell into a standalone HTML. Replace the figure and panels with the concept's model, controls, and concise feedback. Keep only the classes used by that artifact. -->
<main class="figure-area">
<div class="plot"><svg class="graphic" role="img" aria-label="Demo figure"><path d="M40 300 L180 180 L320 220 L460 80" fill="none" stroke="var(--mark-neutral)" stroke-width="2.5"/><circle cx="320" cy="220" r="7" fill="var(--amber)" stroke="var(--work)" stroke-width="2"/><circle cx="460" cy="80" r="10" fill="none" stroke="var(--coral)" stroke-width="2.5"/></svg></div>
<div class="playback"><button class="primary">Run</button><button>Step</button><button>Reset</button><div class="readouts"><dl><dt>Step</dt><dd>0</dd></dl><dl><dt>x</dt><dd>−2</dd></dl><dl><dt>Loss</dt><dd>25</dd></dl></div></div>
</main>
<aside class="pillar">
<section class="panel"><h2>Shape the next step</h2><div class="control"><label for="demo-range">Input <output>0.25</output></label><input id="demo-range" type="range" min="0" max="1" step="0.05" value="0.25"></div><details class="disclosure"><summary><span class="summary-label">See the calculation</span></summary><div class="disclosure-body"><div class="disclosure-inner"><p class="equation">x next = x − η × f′(x)</p></div></div></details></section>
<section class="panel"><div class="feedback"><h2>A smaller distance</h2><p>The next step moves closer to the minimum.</p></div><details class="disclosure"><summary><span class="summary-label">Model notes</span></summary><div class="disclosure-body"><div class="disclosure-inner"><p>Model assumptions go here.</p></div></div></details></section>
</aside>
<!-- Copy the needed inert pattern into the output, then fill its slots from the model. -->
<template id="comparison-row-pattern"><div class="comparison-row"><span class="comparison-label" data-slot="label"></span><div class="comparison-track"><div class="comparison-bar" data-slot="bar"></div><i class="comparison-guide" aria-hidden="true"></i></div><span class="comparison-value" data-slot="value"></span></div></template>
<template id="annotated-item-pattern"><li class="annotated-item"><span class="item-role" aria-hidden="true"></span><span class="item-body"></span></li></template>
<template id="reference-task-pattern"><section class="panel learning-layout"><div class="reference-panel"><h2 data-slot="reference-title"></h2><div class="panel-content" data-slot="reference"></div></div><div class="target-panel"><h2 data-slot="task-title"></h2><div class="context-row" data-slot="context"></div><div class="task-prompt" data-slot="question"></div><div class="actions" data-slot="actions"></div></div></section></template>
<script>
const themeButton = document.getElementById('theme-toggle');
const systemTheme = matchMedia('(prefers-color-scheme: dark)');
function currentTheme(){return document.documentElement.dataset.theme || (systemTheme.matches ? 'dark' : 'light');}
function updateThemeButton(){const dark = currentTheme() === 'dark';document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';themeButton.setAttribute('aria-label',dark ? 'Switch to light theme' : 'Switch to dark theme');}
try{const savedTheme = localStorage.getItem('socratic-workshop-theme');if(savedTheme === 'dark' || savedTheme === 'light')document.documentElement.dataset.theme = savedTheme;}catch{}
themeButton.addEventListener('click',()=>{const theme = currentTheme() === 'dark' ? 'light' : 'dark';document.documentElement.dataset.theme = theme;try{localStorage.setItem('socratic-workshop-theme',theme);}catch{}updateThemeButton();});
systemTheme.addEventListener('change',updateThemeButton);
updateThemeButton();

/* Slider fields fill to --p. The scene script may call syncRangeFill on reset. */
function syncRangeFill(input){const min=Number(input.min||0),max=Number(input.max||100);input.style.setProperty('--p',(Number(input.value)-min)/(max-min)*100+'%');}
document.querySelectorAll('input[type="range"]').forEach(input=>{syncRangeFill(input);input.addEventListener('input',()=>syncRangeFill(input));});

/* Disclosures animate their row height; a closing detail keeps its body visible
   for 200 ms before the open attribute is removed. */
document.querySelectorAll('.disclosure > summary').forEach(summary=>{
  summary.addEventListener('click',event=>{
    const d=summary.parentElement;
    if(d.open){event.preventDefault();d.classList.add('closing');setTimeout(()=>{d.open=false;d.classList.remove('closing');},200);}
  });
});

/* Mark popovers: a focusable mark (data-mark, or any element passed to bindMark)
   opens one glass popover beside it. Content is {title, body, value} or a
   function returning it; value may itself be a function for live numbers. */
const markPopover=document.createElement('div');
markPopover.className='mark-popover';
markPopover.setAttribute('role','dialog');
markPopover.hidden=true;
document.body.appendChild(markPopover);
let markAnchor=null,markBounds=null,markValueEl=null,markValueFn=null,popTimer=0;
function openMarkPopover(anchor,content,bounds){
  closeMarkPopover();
  clearTimeout(popTimer);
  markAnchor=anchor;
  markBounds=bounds||null;
  anchor.classList.add('is-open');
  const data=typeof content==='function'?content():content;
  markPopover.replaceChildren();
  if(data.title){const h=document.createElement('h3');h.textContent=data.title;markPopover.append(h);}
  if(data.body){const p=document.createElement('p');p.textContent=data.body;markPopover.append(p);}
  markValueEl=null;markValueFn=null;
  if(data.value!=null){markValueEl=document.createElement('p');markValueEl.className='mark-value';markPopover.append(markValueEl);
    if(typeof data.value==='function'){markValueFn=data.value;markValueEl.textContent=markValueFn();}
    else markValueEl.textContent=data.value;}
  markPopover.hidden=false;
  markPopover.classList.remove('is-open');
  positionMarkPopover();
  requestAnimationFrame(()=>markPopover.classList.add('is-open'));
}
function positionMarkPopover(){
  if(!markAnchor)return;
  const r=markAnchor.getBoundingClientRect();
  const b=markBounds?markBounds.getBoundingClientRect():{left:8,top:8,right:innerWidth-8,bottom:innerHeight-8};
  const pw=markPopover.offsetWidth,ph=markPopover.offsetHeight;
  let side='right';
  let left=r.right+14;
  if(left+pw>b.right-8){left=r.left-14-pw;side='left';}
  left=Math.max(b.left+8,Math.min(left,b.right-8-pw));
  const top=Math.max(b.top+8,Math.min(r.top+r.height/2-ph/2,b.bottom-8-ph));
  markPopover.dataset.side=side;
  markPopover.style.left=left+'px';
  markPopover.style.top=top+'px';
}
function closeMarkPopover(){
  if(!markAnchor)return;
  markAnchor.classList.remove('is-open');
  markAnchor=null;markValueFn=null;markValueEl=null;
  markPopover.classList.remove('is-open');
  clearTimeout(popTimer);
  popTimer=setTimeout(()=>{markPopover.hidden=true;},130);
}
function toggleMarkPopover(anchor,content,bounds){
  if(markAnchor===anchor)closeMarkPopover();
  else openMarkPopover(anchor,content,bounds);
}
/* Re-read the live value and re-anchor while open (e.g. during playback). */
function refreshMarkPopover(){
  if(markValueFn&&markValueEl)markValueEl.textContent=markValueFn();
  positionMarkPopover();
}
function bindMark(el,content,bounds){
  el.addEventListener('click',event=>{event.stopPropagation();toggleMarkPopover(el,content,bounds||el);});
  el.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMarkPopover(el,content,bounds||el);}
  });
}
document.addEventListener('click',event=>{
  if(markAnchor&&!markPopover.contains(event.target)&&!markAnchor.contains(event.target))closeMarkPopover();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&markAnchor){const m=markAnchor;closeMarkPopover();if(m.focus)m.focus();}
});
</script>
